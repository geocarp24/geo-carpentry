<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentTeamSection — Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #07080d; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  @keyframes fadeIn  { from { opacity:0 } to { opacity:1 } }
  @keyframes slideUp { from { transform:translateY(24px); opacity:0 } to { transform:translateY(0); opacity:1 } }

  .agents-section {
    background: linear-gradient(180deg,#07080d 0%,#0f1117 100%);
    padding: 5rem 1.5rem; color: #f8f8ff;
  }
  .agents-inner { max-width: 1120px; margin: 0 auto; }

  .agents-header { text-align: center; margin-bottom: 2.5rem; }
  .agents-eyebrow {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 14px; border-radius: 999px;
    background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.28);
    font-size: 11px; font-weight: 700; color: #a5b4fc; letter-spacing: .09em;
    margin-bottom: 1.1rem;
  }
  .agents-eyebrow-dot { width:6px; height:6px; border-radius:50%; background:#6366f1; box-shadow:0 0 6px #6366f1; }
  .agents-title {
    font-size: clamp(1.6rem,4vw,2.4rem); font-weight:800; letter-spacing:-.02em;
    background: linear-gradient(135deg,#f9fafb 30%,#94a3b8 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    margin-bottom:.75rem;
  }
  .agents-subtitle { max-width:500px; margin:0 auto; font-size:.95rem; color:#64748b; line-height:1.65; }

  .agents-legend { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:2.25rem; }
  .legend-btn {
    display:inline-flex; align-items:center; gap:6px; font-size:12px; cursor:pointer;
    padding:4px 10px; border-radius:999px; border:1px solid transparent;
    background:transparent; color:#64748b; transition:color .18s, background .18s, border-color .18s;
    font-family: inherit;
  }
  .legend-btn.active { color:#e2e8f0; background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.12); }
  .legend-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .legend-btn.active .legend-dot { box-shadow:0 0 6px var(--dot-color); }
  .legend-count { margin-left:2px; padding:1px 6px; border-radius:999px; font-size:10px; background:rgba(255,255,255,.07); color:#94a3b8; }

  .agents-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(80px,1fr)); gap:12px; }

  .agent-card {
    display:block; text-align:center; cursor:pointer;
    background:transparent; border:none; padding:0;
    transition:transform .22s ease; font-family:inherit;
  }
  .agent-card:hover { transform:translateY(-4px); }

  .agent-avatar-wrap { display:inline-block; position:relative; width:72px; height:72px; }
  .agent-avatar {
    width:72px; height:72px; border-radius:50%; object-fit:cover; display:block;
    border: 2px solid var(--border-alpha);
    transition: border-color .22s ease, box-shadow .22s ease;
  }
  .agent-card:hover .agent-avatar { border-color: var(--dot-color); box-shadow: 0 0 18px var(--glow); }
  .agent-avatar-fallback {
    width:72px; height:72px; border-radius:50%; background:var(--glow);
    border:2px solid var(--border-alpha); display:none; align-items:center; justify-content:center;
    font-size:28px; font-weight:700; color:var(--dot-color);
  }
  .agent-status-dot {
    position:absolute; bottom:0; right:0; width:14px; height:14px; border-radius:50%;
    background:var(--dot-color); border:2px solid #09090f; box-shadow:0 0 6px var(--dot-color);
  }
  .agent-name {
    margin:6px 0 0; font-size:11px; font-weight:600; color:#f8f8ff; line-height:1.3;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:80px;
  }
  .agent-role {
    margin:2px 0 0; font-size:10px; color:#64748b; line-height:1.3; max-width:80px; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }

  .agents-stats {
    display:flex; gap:2.5rem; justify-content:center; flex-wrap:wrap;
    margin-top:3rem; padding-top:2.25rem; border-top:1px solid rgba(255,255,255,.06);
  }
  .stat { text-align:center; }
  .stat-value { font-size:1.9rem; font-weight:800; letter-spacing:-.02em; }
  .stat-label { font-size:.72rem; color:#64748b; margin-top:3px; }

  .modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.78);
    backdrop-filter:blur(8px); z-index:9999; align-items:center; justify-content:center;
    padding:1.25rem; animation:fadeIn .15s ease both;
  }
  .modal-overlay.open { display:flex; }
  .modal-box {
    background:#0f1117; border:1px solid var(--modal-border); border-radius:1.25rem;
    max-width:440px; width:100%; padding:2rem;
    box-shadow:0 0 50px var(--modal-glow), 0 25px 60px rgba(0,0,0,.7);
    animation:slideUp .22s ease both; position:relative;
  }
  .modal-close {
    position:absolute; top:1rem; right:1rem; background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1); border-radius:50%; width:32px; height:32px;
    color:#9ca3af; cursor:pointer; font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center; transition:background .15s; font-family:inherit;
  }
  .modal-close:hover { background:rgba(255,255,255,.13); }
  .modal-portrait-row { display:flex; align-items:center; gap:1.25rem; margin-bottom:1.25rem; }
  .modal-portrait-wrap { position:relative; flex-shrink:0; }
  .modal-portrait {
    width:88px; height:88px; border-radius:50%; object-fit:cover; display:block;
    border:2px solid var(--modal-border); box-shadow:0 0 24px var(--modal-glow);
  }
  .modal-portrait-dot {
    position:absolute; bottom:2px; right:2px; width:16px; height:16px; border-radius:50%;
    background:var(--dot-color); border:2px solid #0f1117; box-shadow:0 0 8px var(--dot-color);
  }
  .modal-name { font-size:1.4rem; font-weight:700; color:#f9fafb; line-height:1.2; }
  .modal-role { font-size:.82rem; color:#9ca3af; margin-top:3px; }
  .modal-badge {
    display:inline-flex; align-items:center; gap:5px; margin-top:.5rem;
    padding:2px 10px; border-radius:999px; font-size:.7rem; font-weight:700; letter-spacing:.06em;
  }
  .modal-badge-dot { width:6px; height:6px; border-radius:50%; }
  .modal-desc { font-size:.88rem; line-height:1.7; color:#d1d5db; margin-bottom:1.1rem; }
  .modal-tech { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:1.5rem; }
  .tech-pill {
    padding:3px 10px; border-radius:999px; font-size:.7rem; font-weight:500;
    background:rgba(255,255,255,.05); color:#94a3b8; border:1px solid rgba(255,255,255,.08);
  }
  .modal-cta {
    display:block; text-align:center; padding:.75rem 1rem; border-radius:.75rem;
    background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%); color:#fff;
    font-weight:700; font-size:.875rem; text-decoration:none;
    transition:opacity .2s,transform .2s; letter-spacing:.01em;
  }
  .modal-cta:hover { opacity:.88; transform:translateY(-1px); }
</style>
</head>
<body>

<section class="agents-section">
  <div class="agents-inner">
    <div class="agents-header">
      <div class="agents-eyebrow">
        <span class="agents-eyebrow-dot"></span>
        POWERED BY INVESTOROS
      </div>
      <h2 class="agents-title">Tu equipo de 27 agentes AI</h2>
      <p class="agents-subtitle">Cada agente trabaja las 24 horas, los 7 días de la semana. Haz clic en cualquiera para conocerlo.</p>
    </div>

    <div class="agents-legend" id="legend">
      <button class="legend-btn active" onclick="setFilter('all',this)" style="--dot-color:#fff">
        <span class="legend-dot" style="background:#fff"></span>Todos<span class="legend-count">27</span>
      </button>
      <button class="legend-btn" onclick="setFilter('production',this)" style="--dot-color:#22c55e">
        <span class="legend-dot" style="background:#22c55e"></span>En producción<span class="legend-count">12</span>
      </button>
      <button class="legend-btn" onclick="setFilter('code-complete',this)" style="--dot-color:#f59e0b">
        <span class="legend-dot" style="background:#f59e0b"></span>Listos para deploy<span class="legend-count">12</span>
      </button>
      <button class="legend-btn" onclick="setFilter('planned',this)" style="--dot-color:#6366f1">
        <span class="legend-dot" style="background:#6366f1"></span>Próximamente<span class="legend-count">3</span>
      </button>
    </div>

    <div class="agents-grid" id="agentsGrid"></div>

    <div class="agents-stats">
      <div class="stat"><div class="stat-value" style="color:#22c55e">12</div><div class="stat-label">Agentes en producción</div></div>
      <div class="stat"><div class="stat-value" style="color:#f59e0b">12</div><div class="stat-label">Listos para activar</div></div>
      <div class="stat"><div class="stat-value" style="color:#6366f1">3</div><div class="stat-label">En desarrollo</div></div>
      <div class="stat"><div class="stat-value" style="color:#f8f8ff">24/7</div><div class="stat-label">Operación continua</div></div>
    </div>
  </div>
</section>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-box" id="modalBox">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-portrait-row">
      <div class="modal-portrait-wrap">
        <img id="modalImg" class="modal-portrait" src="" alt="">
        <span class="modal-portrait-dot" id="modalDot"></span>
      </div>
      <div>
        <div class="modal-name" id="modalName"></div>
        <div class="modal-role" id="modalRole"></div>
        <span class="modal-badge" id="modalBadge">
          <span class="modal-badge-dot" id="modalBadgeDot"></span>
          <span id="modalBadgeText"></span>
        </span>
      </div>
    </div>
    <p class="modal-desc" id="modalDesc"></p>
    <div class="modal-tech" id="modalTech"></div>
    <a class="modal-cta" id="modalCta" href="https://investoros.tech/#pricing" target="_blank"></a>
  </div>
</div>

<script>
const BASE = 'https://www.investoros.tech/investoros-agents/agent-';
const SC = {
  production:     { label:'EN PRODUCCIÓN', color:'#22c55e', ba:'rgba(34,197,94,0.5)',   glow:'rgba(34,197,94,0.18)',   bbg:'rgba(34,197,94,0.12)'   },
  'code-complete':{ label:'LISTO',          color:'#f59e0b', ba:'rgba(245,158,11,0.5)',  glow:'rgba(245,158,11,0.18)',  bbg:'rgba(245,158,11,0.12)'  },
  planned:        { label:'PRÓXIMAMENTE',   color:'#6366f1', ba:'rgba(99,102,241,0.5)',  glow:'rgba(99,102,241,0.18)', bbg:'rgba(99,102,241,0.12)' }
};
const AGENTS = [
  {name:'Fer',  slug:'fer',  role:'AI Lead Receptionist', status:'production',    tech:'SMS · OpenPhone · PHP/Hostinger',  desc:'Primera línea de contacto. Responde SMS en inglés y español, califica leads en tiempo real y agenda citas automáticamente — 24/7 sin descanso.'},
  {name:'Tracy',slug:'tracy',role:'Skip Tracer',          status:'production',    tech:'Tracerfy API · owner lookup',       desc:'Encuentra datos de propietarios (nombre, teléfono, dirección) a partir de registros públicos y APIs especializadas.'},
  {name:'Marco',slug:'marco',role:'Social Media Manager', status:'production',    tech:'Meta Graph API · bilingual',        desc:'Publica contenido bilingüe en Facebook e Instagram y mantiene la voz de marca consistente. Conectado directo a Meta Graph API.'},
  {name:'Sofia',slug:'sofia',role:'Visual Creator',       status:'production',    tech:'HTML→PNG · Cloudinary',             desc:'Genera imágenes para redes sociales — banners, before/after, promociones — usando plantillas HTML renderizadas a PNG.'},
  {name:'Leo',  slug:'leo',  role:'Video Director',       status:'production',    tech:'FFmpeg · HeyGen · Reels 15s',       desc:'Produce Reels de 15 segundos con avatares AI, voz sintética y edición automática. De guión a video publicado en minutos.'},
  {name:'Max',  slug:'max',  role:'Quality Gate',         status:'production',    tech:'brand compliance · anti-waste',     desc:'Revisa todo el contenido antes de publicar: cumplimiento de marca, coherencia de mensajes y eliminación de desperdicio.'},
  {name:'Nina', slug:'nina', role:'Content Optimizer',    status:'production',    tech:'AI learning loop · rewrites',       desc:'Analiza el rendimiento del contenido y reescribe automáticamente las piezas de bajo rendimiento.'},
  {name:'Sage', slug:'sage', role:'Analytics',            status:'production',    tech:'FB+IG engagement · tiers',          desc:'Monitorea engagement en Facebook e Instagram y genera reportes accionables cada semana.'},
  {name:'Rex',  slug:'rex',  role:'SEO Monitor',          status:'production',    tech:'geo-grid · CWV · 7 motores',        desc:'Audita posicionamiento local en 7 motores de búsqueda y reporta caídas de ranking antes de que te cuesten clientes.'},
  {name:'Ava',  slug:'ava',  role:'UX Optimizer',         status:'production',    tech:'LCP · CRO audit · mobile',          desc:'Audita conversiones, velocidad de carga (LCP) y experiencia móvil. Identifica exactamente dónde los visitantes abandonan.'},
  {name:'Echo', slug:'echo', role:'Meta Auditor',         status:'production',    tech:'FB+IG account health · on-demand',  desc:'Analiza la salud de tus cuentas de Facebook e Instagram: políticas, límites de gasto y errores de anuncios.'},
  {name:'Zed',  slug:'zed',  role:'Dev Ops',              status:'production',    tech:'Telegram→GitHub · Python · VPS',   desc:'Convierte comandos de Telegram en commits de GitHub. Automatiza deploys y mantiene el VPS desde un chat.'},
  {name:'Eli',  slug:'eli',  role:'SEO Content Writer',   status:'code-complete', tech:'city pages · bilingual · WP',       desc:'Redacta páginas de servicio bilingües optimizadas para ciudades específicas con schema markup.'},
  {name:'Chase',slug:'chase',role:'Paid Ads Auditor',     status:'code-complete', tech:'Google/Meta/TikTok Ads',            desc:'Audita campañas de Google, Meta y TikTok Ads. Detecta presupuesto desperdiciado y creativos de bajo rendimiento.'},
  {name:'Nova', slug:'nova', role:'GBP Manager',          status:'code-complete', tech:'GBP posts · reviews · OAuth',       desc:'Gestiona tu Google Business Profile: publica actualizaciones, responde reseñas y sube fotos automáticamente.'},
  {name:'Kai',  slug:'kai',  role:'Lead Scorer',          status:'code-complete', tech:'0-100 scoring · Hot/Warm/Cold',     desc:'Asigna un score 0–100 a cada lead y los enruta: Hot a llamada, Warm a seguimiento, Cold a nurture.'},
  {name:'Luca', slug:'luca', role:'LinkedIn B2B',         status:'code-complete', tech:'ICP targeting · B2B outreach',      desc:'Prospección en LinkedIn dirigida a constructores, inversionistas y administradores de propiedades.'},
  {name:'Remi', slug:'remi', role:'Community Manager',    status:'code-complete', tech:'Reddit · organic community',        desc:'Participa en Reddit con respuestas útiles que generan awareness orgánico y tráfico cualificado sin publicidad.'},
  {name:'Scout',slug:'scout',role:'Web Scraper',          status:'code-complete', tech:'foreclosures · probate · FSBO',     desc:'Extrae oportunidades desde registros públicos. Alimenta el pipeline con leads de motivación alta.'},
  {name:'Atlas',slug:'atlas',role:'Executive Brief',      status:'code-complete', tech:'Monday 7am · 8 agents · digest',    desc:'Cada lunes a las 7am envía un resumen ejecutivo unificado: métricas clave, alertas y prioridades.'},
  {name:'Orion',slug:'orion',role:'System Watchdog',      status:'code-complete', tech:'self-repair · weekly evolution',    desc:'Monitorea la salud de todos los agentes, detecta fallos y activa auto-reparación.'},
  {name:'Viper',slug:'viper',role:'Sales Closer',         status:'code-complete', tech:'competitor prices · objections',    desc:'Monitorea precios de competidores y genera argumentos de cierre basados en diferencias concretas.'},
  {name:'Ember',slug:'ember',role:'Onboarding',           status:'code-complete', tech:'email marketing · SMTP · SPF/DKIM', desc:'Secuencias de email de bienvenida y gestión de listas. Convierte nuevos contactos en clientes recurrentes.'},
  {name:'Flynn',slug:'flynn',role:'Automation Builder',   status:'code-complete', tech:'Make.com · no-code workflows',      desc:'Crea flujos de trabajo en Make.com conectando tus herramientas. Elimina tareas manuales repetitivas.'},
  {name:'Carto',slug:'carto',role:'Territory Mapping',    status:'planned',       tech:'geo coverage · territory',          desc:'Visualiza tu cobertura geográfica e identifica zonas sin presencia para maximizar el radio de operación.'},
  {name:'Ward', slug:'ward', role:'Compliance & Risk',    status:'planned',       tech:'TCPA · CAN-SPAM · ADA',             desc:'Verifica cumplimiento de TCPA, CAN-SPAM y ADA en todas las comunicaciones. Protege el negocio de sanciones.'},
  {name:'Penny',slug:'penny',role:'Financial Intelligence',status:'planned',      tech:'Stripe · billing · forecasting',    desc:'Analiza ingresos de Stripe, proyecta flujo de caja y genera reportes financieros automáticos.'}
];

function buildCard(a){
  const sc=SC[a.status];
  const card=document.createElement('button');
  card.className='agent-card';
  card.style.cssText=`--dot-color:${sc.color};--border-alpha:${sc.ba};--glow:${sc.glow};`;
  card.setAttribute('aria-label',`Ver detalles de ${a.name}`);
  card.onclick=()=>openModal(a);
  card.innerHTML=`
    <span class="agent-avatar-wrap">
      <img class="agent-avatar" src="${BASE+a.slug}.png" alt="${a.name}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <span class="agent-avatar-fallback">${a.name[0]}</span>
      <span class="agent-status-dot"></span>
    </span>
    <p class="agent-name">${a.name}</p>
    <p class="agent-role">${a.role}</p>`;
  return card;
}

function renderGrid(f){
  const g=document.getElementById('agentsGrid');g.innerHTML='';
  (f==='all'?AGENTS:AGENTS.filter(a=>a.status===f)).forEach(a=>g.appendChild(buildCard(a)));
}
function setFilter(f,btn){
  document.querySelectorAll('.legend-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); renderGrid(f);
}
function openModal(a){
  const sc=SC[a.status],box=document.getElementById('modalBox');
  box.style.setProperty('--dot-color',sc.color);
  box.style.setProperty('--modal-border',sc.ba);
  box.style.setProperty('--modal-glow',sc.glow);
  const img=document.getElementById('modalImg');
  img.src=BASE+a.slug+'.png'; img.alt=a.name;
  document.getElementById('modalDot').style.cssText=`background:${sc.color};box-shadow:0 0 8px ${sc.color};`;
  document.getElementById('modalName').textContent=a.name;
  document.getElementById('modalRole').textContent=a.role;
  const badge=document.getElementById('modalBadge');
  badge.style.background=sc.bbg; badge.style.color=sc.color;
  document.getElementById('modalBadgeDot').style.cssText=`background:${sc.color};box-shadow:0 0 5px ${sc.color};`;
  document.getElementById('modalBadgeText').textContent=sc.label;
  document.getElementById('modalDesc').textContent=a.desc;
  const tech=document.getElementById('modalTech');tech.innerHTML='';
  if(a.tech)a.tech.split(' · ').forEach(t=>{const p=document.createElement('span');p.className='tech-pill';p.textContent=t;tech.appendChild(p);});
  const cta=document.getElementById('modalCta');
  cta.textContent=`Activar ${a.name} en mi negocio →`;
  document.getElementById('modal').classList.add('open');
}
function closeModal(e){
  if(!e||e.target===document.getElementById('modal')||e.currentTarget.classList.contains('modal-close'))
    document.getElementById('modal').classList.remove('open');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').classList.remove('open');});
renderGrid('all');
</script>
</body>
</html>
